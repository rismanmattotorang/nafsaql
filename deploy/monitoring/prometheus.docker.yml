# Scrape the gateway on the reference machine. Validate: promtool check config prometheus.yml
global: {scrape_interval: 15s, evaluation_interval: 30s}
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: nafs-gateway
    static_configs: [{targets: ["gateway:8080"]}]
  - job_name: vllm
    static_configs: [{targets: ["system1:8001", "system2:8002"]}]
