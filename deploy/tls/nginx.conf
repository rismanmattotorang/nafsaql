# Alternative TLS front end with nginx (SR-006). Replace the certificate paths; the gateway listens on
# 127.0.0.1:8080 with bearer tokens enabled.
server {
    listen 443 ssl http2;
    server_name nafs.example.org;
    ssl_certificate     /etc/ssl/nafs/fullchain.pem;
    ssl_certificate_key /etc/ssl/nafs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 2m;
    location = /metrics { return 404; }
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;            # SSE streams token by token
        proxy_read_timeout 30m;         # the slow path can take minutes on a CPU host
    }
}
server { listen 80; server_name nafs.example.org; return 301 https://$host$request_uri; }
