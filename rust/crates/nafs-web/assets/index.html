<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nafs-Aql</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app" class="shell">
  <a class="skip" href="#view">Skip to content</a>
  <nav class="rail" aria-label="Main">
    <div class="brand" title="Nafs-Aql">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="24" cy="32" r="9"/><circle cx="40" cy="32" r="9"/></svg>
      <span>Nafs-Aql</span>
    </div>
    <a href="#/chat" data-route="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Chat</span></a>
    <a href="#/eval" data-route="eval" title="Lab: experiments on how System 1 and System 2 should interact"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg><span>Lab</span></a>
    <a href="#/gate" data-route="gate"><svg viewBox="0 0 24 24"><path d="M12 3 4 7v5c0 4.4 3.4 8 8 9 4.6-1 8-4.6 8-9V7z"/><path d="M8.5 12.5 11 15l4.5-5"/></svg><span>Muhasaba</span></a>
    <a href="#/tazkiya" data-route="tazkiya" title="Tazkiya: distillation of verified traces (Phase 3)"><svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z"/><path d="M5 19 13 11"/></svg><span>Tazkiya</span></a>
    <a href="#/rooms" data-route="rooms"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><circle cx="16.5" cy="10" r="2.6"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5M14 15.5c2.6-.6 5.6.6 6.5 3.5"/></svg><span>Rooms</span></a>
    <a href="#/bench" data-route="bench"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/></svg><span>Performance</span></a>
    <a href="#/system" data-route="system"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><path d="M8 7h.01M8 17h.01"/></svg><span>System</span></a>
    <div class="rail-foot">
      <button id="themeBtn" class="icon-btn" aria-label="Toggle theme" title="Toggle light/dark"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
      <button id="tokenBtn" class="icon-btn" aria-label="API token" title="API token"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M21 12v2"/></svg></button>
    </div>
  </nav>
  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">Chat</h1>
      <div class="top-right">
        <div id="backendPill" class="pill" title="Active model backend"><span class="dot"></span><span class="txt">connecting…</span></div>
      </div>
    </header>
    <section id="view" class="view" tabindex="-1"></section>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><form method="dialog" class="modal-body"><div id="modalContent"></div><div class="modal-actions"><button class="btn ghost" value="cancel">Close</button></div></form></dialog>
<script src="/app.js" type="module"></script>
</body>
</html>
