[package]
name = "nafs-kb"
description = "Knowledge Base (Phase 20): document parsing, chunking, SurrealDB storage, search; vector and graph retrieval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
nafs-types = { path = "../nafs-types" }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
pdf_oxide = { version = "0.3.78", default-features = false }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
ciborium = "0.2.2"
jsonschema = { workspace = true }
htmd = "0.5.6"
rust-stemmers = "1.2.0"
text-splitter = { version = "0.33.1", features = ["markdown"] }
# Phase 35, documents out. Both are already part of the build (pulldown-cmark through text-splitter, office_oxide
# through pdf_oxide), so these lines add no download: they make them usable from this crate.
pulldown-cmark = { version = "0.13.6", default-features = false }
office_oxide = { version = "0.1.16", default-features = false }

[dev-dependencies]
nafs-core = { path = "../nafs-core" }
nafs-context = { path = "../nafs-context" }
