[package]
name = "nafs-memorilla"
description = "Memorilla for Nafs-Aql (Phase 20) on Candle: the reference text encoder (Qwen3-Embedding), later the memory module and its trainer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
serde = { workspace = true }
serde_json = { workspace = true }

smiley-core = { path = "../smiley-core" }

# Apple's Accelerate BLAS for Candle's matmuls on macOS: Candle's portable gemm reached about 7 GFLOP/s on the memory
# module's 16-row products on this Intel Mac (examples/matmul_probe.rs); Linux keeps the portable kernels.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.1", features = ["accelerate"] }
candle-nn = { version = "0.11.1", features = ["accelerate"] }
