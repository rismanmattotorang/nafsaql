# Vendored from the owner's Smiley project (~/Downloads/Smiley, revision 06c2b88 of 2026-11-04, `smiley/src-tauri/crates/smiley-core`,
# Apache-2.0); first vendored on 2026-11-01 at 7cb6028 and updated by a three-way merge in Phase 19. Modified for Nafs-Aql
# (each change is marked `// nafs-aql:`): a continuation prefix, log-probabilities, top-k / min-p on the position-keyed sampler,
# a rotation-aware KV snapshot, per-row caches and attention, the prefix store and the batching engine (`serve.rs`), and the
# `std::array::from_fn` fix in `simd.rs`. See README.md in this directory.
[package]
name = "smiley-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Smiley Core — a CPU inference engine that reports the bytes it moved (vendored into Nafs-Aql)"

# memmap2 is the only dependency, on purpose. Everything else this crate needs is
# either trivial (f16 conversion is twenty lines) or a liability: a tensor framework
# would re-introduce the materialise-a-dequantised-buffer pattern that principle P1
# of the spec exists to forbid, and rayon would make thread count and barrier count
# unpredictable when both are quantities this engine measures and reports.
publish = false
[dependencies]
memmap2 = { workspace = true }
