# CI for Nafs-Aql (OR-001, NFR-023, ER-006). Model-dependent tests (MVP acceptance, contract --live) run locally with `make up`.
name: ci
on: [push, pull_request]
jobs:
  rust:
    strategy:
      matrix: { os: [ubuntu-24.04, macos-14] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --release -- -D warnings
      - run: cargo test --workspace --release
  artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema pyyaml openapi-spec-validator
      - run: openapi-spec-validator api/openapi.yaml
      - run: python -c "import glob,json; from jsonschema import Draft202012Validator as V; [V.check_schema(json.load(open(f))) for f in glob.glob('api/schemas/*.json')]; print('schemas ok')"
      - run: python -c "import yaml; yaml.safe_load(open('config/vllm_launch.yaml'))"
      - run: python -c "import tomllib; tomllib.load(open('config/nafs-aql.toml','rb')); tomllib.load(open('config/nafs-aql.sample.toml','rb'))"
      - run: node --check rust/crates/nafs-web/assets/app.js
      - run: python scripts/gen_tables.py
