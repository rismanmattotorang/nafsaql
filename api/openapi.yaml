openapi: 3.1.0
info:
  title: Nafs-Aql Gateway API
  version: 1.5.1
  summary: Dual-process (System 1 / System 2) chat gateway with verifier-gated deliberation
  description: 'External API of the Nafs-Aql Rust gateway (crate `nafs-gateway`). Every reply exposes the

    reasoning mode that produced it (`fast` or `slow`), the assurance level, and the controller

    decision identifier. Streaming uses Server-Sent Events (SSE); chat rooms use WebSocket.

    Requirement IDs (IF-001..IF-010, FR-002, FR-006) refer to the Nafs-Aql Technical Specification.

    Version 1.1 adds conversation management, the verifier playground, system/backend control, dataset browsing, run cancellation
    and calibration fitting, as implemented by nafs-gateway 0.1 (Phase 1).

    Version 1.2 (Phase 2) adds the rubric judge, the audit stream and self-model (Prop. 5), gate modes (fixed, calibrated,
    budget), recalibration from the ledger with held-out promotion, measured gate parameters (Beta-fit caps, budget curve),
    verifier-rate measurement, new evaluation systems (nafs_blind, slow_conditioned, slow_b<N>), request bounds enforced with
    HTTP 400, and same-origin enforcement (HTTP 403 for foreign Origin or Host).

    Version 1.3 (Phases 3-4) adds human feedback, review and opt-out (Tazkiya), Both-trial preferences, the gates dashboard,
    drift monitoring, the load-test protocol, McNemar/Bonferroni statistics and report export.

    Version 1.4 (Phase 5) adds alerts with a drill, lab insights, resumable evaluation runs, retrieval memory (retrieve /
    retrieved) and the security posture in /v1/system.


    Version 1.5 (Phase 7) adds per-stage latency in usage.stages (queue, prefill, decode and KV-cache reuse for model stages)
    and GET /v1/perf/stages, the latency breakdown by stage.

    '
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: http://localhost:8080
  description: Single-node CPU baseline
security:
- bearerAuth: []
tags:
- name: chat
- name: rooms
- name: bench
- name: eval
- name: system
- name: gate
- name: ledger
- name: verifiers
- name: tazkiya
- name: phase4
- name: lab
- name: phase5
- name: phase7
  description: CPU inference performance and latency attribution (Phase 7)
paths:
  /v1/chat:
    post:
      tags:
      - chat
      operationId: chatComplete
      summary: Complete one chat turn (non-streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Completed reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatReply'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/chat/stream:
    post:
      tags:
      - chat
      operationId: chatStream
      summary: Complete one chat turn as an SSE stream of tokens and controller events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: '`text/event-stream`. Each event has an `event:` name among `token`, `decision`,

            `verification`, `retry`, `degraded`, `done`, `error` and a JSON `data:` payload

            (see `StreamEvent`). The `done` event carries the full `ChatReply`.

            '
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/conversations/{conversation_id}:
    get:
      tags:
      - chat
      operationId: getConversation
      summary: Fetch a conversation with per-message reasoning mode and assurance
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
      - chat
      operationId: renameConversation
      summary: Rename a conversation and/or set its training opt-out (SR-004)
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
                training_opt_out:
                  type: boolean
      responses:
        '204':
          description: Renamed
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
      - chat
      operationId: deleteConversation
      summary: Delete a conversation and its messages
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/decisions/{decision_id}:
    get:
      tags:
      - chat
      operationId: getDecision
      summary: Fetch the controller decision record for a reply
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Decision record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/rooms:
    get:
      tags:
      - rooms
      operationId: listRooms
      summary: List chat rooms, most recently active first
      description: Each room carries who is connected now (`members`, `users`), whether the assistant is answering
        (`busy`) and how many questions wait (`queued`).
      responses:
        '200':
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - rooms
      operationId: createRoom
      summary: Create a chat room
      description: The name is trimmed, control characters are dropped, runs of whitespace collapse to one space and
        it is cut to 80 characters. Names are unique without regard to case. A gateway keeps at most 500 rooms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  maxLength: 80
                profile:
                  $ref: '#/components/schemas/ModelProfile'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/rooms/{room_id}:
    parameters:
    - name: room_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - rooms
      operationId: getRoom
      summary: One room
      responses:
        '200':
          description: The room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
      - rooms
      operationId: renameRoom
      summary: Rename a room
      description: Same rules as creation. A room may change the case of its own name. Connected members receive a
        `room_renamed` frame.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  maxLength: 80
      responses:
        '200':
          description: The renamed room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
      - rooms
      operationId: deleteRoom
      summary: Delete a room and everything stored from it
      description: 'Permanent. Connected members receive `room_deleted` and are disconnected with WebSocket close code
        4004. A running answer is cancelled and given up to 10 seconds to stop. In one transaction the room, its
        conversation and messages, and the replies, decisions, audits, feedback, reviews, preference trials and
        retrieval-memory entries made from it are removed. The append-only trace file holds no message content and
        is left as it is.'
      responses:
        '200':
          description: What was removed
          content:
            application/json:
              schema:
                type: object
                required:
                - deleted
                - room_id
                - name
                - removed
                properties:
                  deleted:
                    type: boolean
                  room_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  disconnected:
                    type: integer
                    description: Members that were connected when the room was deleted
                  removed:
                    type: object
                    properties:
                      messages:
                        type: integer
                      replies:
                        type: integer
                      memory_entries:
                        type: integer
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /ws/rooms/{room_id}:
    get:
      tags:
      - rooms
      operationId: roomSocket
      summary: WebSocket upgrade for a chat room (frames are `RoomFrame` JSON objects)
      description: 'Query parameters: `user` (display name: letters, digits, space, `-`, `_`; at most 32 characters;
        made unique in the room by appending a number; `Assistant` and `System` are reserved) and `token` when
        authentication is on. The first frame is always `welcome`; build the transcript from its `cursor` (stored
        messages that precede the running turn) and `pending` (questions of the running and queued turns), then
        apply live frames: every turn appears exactly once, however late you join or reconnect. Client frames:
        `user_message` (`payload.content` up to 8000 characters; optional `force_mode`, `lambda`, `show_reasoning`),
        `typing` and `ping`. A room holds 64 members; at most three questions queue behind the running one.'
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: user
        in: query
        required: false
        schema:
          type: string
          maxLength: 32
      responses:
        '101':
          description: Switching Protocols
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/bench/runs:
    get:
      tags:
      - bench
      operationId: listBenchRuns
      summary: List performance-test runs
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BenchRun'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - bench
      operationId: startBenchRun
      summary: Start a load test (FR-052)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenchRunRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchRun'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/bench/runs/{run_id}:
    get:
      tags:
      - bench
      operationId: getBenchRun
      summary: Fetch a performance-test run with latency quantiles
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/eval/runs:
    get:
      tags:
      - eval
      operationId: listEvalRuns
      summary: List evaluation runs
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvalRun'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - eval
      operationId: startEvalRun
      summary: Start an evaluation run (FR-050)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalRunRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRun'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/eval/runs/{run_id}:
    get:
      tags:
      - eval
      operationId: getEvalRun
      summary: Fetch an evaluation run with metrics and paired statistics
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/self-model:
    get:
      tags:
      - system
      operationId: getSelfModel
      summary: Per-domain capability table with the audit-weighted estimator (FR-041, Prop. 5); unmeasured below 30 audits
      responses:
        '200':
          description: Capability table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfModel'
        '403':
          $ref: '#/components/responses/Forbidden'
  /healthz:
    get:
      tags:
      - system
      operationId: health
      summary: Liveness and backend readiness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - degraded
                  backends:
                    type: object
                    additionalProperties:
                      type: string
                      enum:
                      - ready
                      - unavailable
                  backend:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /metrics:
    get:
      tags:
      - system
      operationId: metrics
      summary: Prometheus metrics (NFR-021)
      security: []
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /openapi.json:
    get:
      tags:
      - system
      operationId: openapi
      summary: This document (IF-001)
      security: []
      responses:
        '200':
          description: OpenAPI document
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/conversations:
    get:
      tags:
      - chat
      operationId: listConversations
      summary: List persisted conversations (most recent first)
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/bench/prompt-sets:
    get:
      tags:
      - bench
      operationId: listPromptSets
      summary: Built-in prompt sets for load tests
      responses:
        '200':
          description: Prompt sets
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    label:
                      type: string
                    prompts:
                      type: array
                      items:
                        type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/bench/runs/{run_id}/cancel:
    post:
      tags:
      - bench
      operationId: cancelBenchRun
      summary: Cancel an active run after in-flight items finish
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Cancelling
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/eval/runs/{run_id}/cancel:
    post:
      tags:
      - eval
      operationId: cancelEvalRun
      summary: Cancel an active run after in-flight items finish
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Cancelling
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/eval/datasets:
    get:
      tags:
      - eval
      operationId: listDatasets
      summary: Evaluation datasets with task counts, domains and licences
      responses:
        '200':
          description: Datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dataset'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/eval/datasets/{name}:
    get:
      tags:
      - eval
      operationId: previewDataset
      summary: First tasks of a dataset
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 25
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/eval/runs/{run_id}/calibrate:
    post:
      tags:
      - eval
      operationId: fitCalibration
      summary: Fit the e1_hat calibration from a run (k-fold held-out ECE); promoted only if NFR-020 holds (FR-015)
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Fit and promotion verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                include_ledger:
                  type: boolean
                  default: false
  /v1/verify:
    post:
      tags:
      - system
      operationId: verify
      summary: Run the exact verifiers on an answer (verifier playground, FR-030)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifierResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/system:
    get:
      tags:
      - system
      operationId: getSystem
      summary: Backends (live health), gate, deliberation caps, calibration, host
      responses:
        '200':
          description: System
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/system/backend:
    post:
      tags:
      - system
      operationId: setBackend
      summary: Switch the active backend set at runtime (llama | vllm) Refused with 503 when the target backend is not reachable,
        unless force is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                force:
                  type: boolean
                  default: false
                  description: Switch even when the backend does not pass a health check
      responses:
        '200':
          description: Switched
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_backend:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Target backend not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/system/activity:
    get:
      tags:
      - system
      operationId: getActivity
      summary: Most recent replies (mode, assurance, latency) for dashboards
      responses:
        '200':
          description: Recent replies
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/judge:
    post:
      tags:
      - verifiers
      operationId: judge
      summary: 'Score an answer with the rubric judge (FR-034): pass iff h, a, u >= 0.5 and V >= 0.7'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - question
              - answer
              properties:
                question:
                  type: string
                answer:
                  type: string
      responses:
        '200':
          description: Judge verdict (verifier = judge, exact = false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifierResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/BackendUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/verifiers:
    get:
      tags:
      - verifiers
      operationId: getVerifierRates
      summary: Published (r, phi) per verifier (FR-032)
      responses:
        '200':
          description: Rates
          content:
            application/json:
              schema:
                type: object
                properties:
                  rates:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Rates'
                  note:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/verifiers/runs:
    get:
      tags:
      - verifiers
      operationId: listRateRuns
      summary: Verifier measurement runs
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - verifiers
      operationId: startRateRun
      summary: Mutation-test the exact verifiers (and optionally the judge) and publish (r, phi) (ER-003)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items_per_dataset:
                  type: integer
                  default: 60
                include_judge:
                  type: boolean
                  default: false
                concurrency:
                  type: integer
                  default: 3
                code_datasets:
                  type: array
                  items:
                    type: string
                  default:
                  - mbpp
                  - humaneval
                  description: Code datasets for mutants; humaneval_plus and mbpp_plus carry the EvalPlus test suites
                judge_only:
                  type: boolean
                  default: false
      responses:
        '202':
          description: Started
          content:
