        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit or backpressure (NFR-011); includes Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
          description: seconds
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BackendUnavailable:
      description: No model backend available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Cross-origin request, or a Host header that does not name this machine while auth is off (DNS-rebinding
        guard)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request clashes with existing state, for example a room name that is already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Error taxonomy code, e.g. E_BACKEND_TIMEOUT
        message:
          type: string
        request_id:
          type: string
    ModelProfile:
      type: string
      enum:
      - A
      - B
      - C
      description: Model profile (MR-001)
    ReasoningMode:
      type: string
      enum:
      - fast
      - slow
      description: Path that produced the reply (IF-003)
    Assurance:
      type: string
      enum:
      - verified
      - consensus
      - unverified
      - abstained
      description: FR-031
    Domain:
      type: string
      enum:
      - code
      - math
      - structured
      - factual
      - open
      - other
    ChatRequest:
      type: object
      required:
      - messages
      properties:
        conversation_id:
          type: string
          format: uuid
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Message'
          maxItems: 400
        domain_hint:
          $ref: '#/components/schemas/Domain'
        lambda:
          type: number
          minimum: 0
          maximum: 1
          description: Speed-care control; price of compute relative to error cost (FR-004)
        force_mode:
          $ref: '#/components/schemas/ReasoningMode'
          description: Operator override for experiments; ignored in production mode
        verification:
          type: object
          description: Optional verifier inputs for verifiable tasks
          properties:
            tests:
              type: array
              items:
                type: string
              description: Unit tests (code domain)
            reference_answer:
              type: string
              description: Reference (math domain)
            json_schema:
              type: object
              description: Schema the answer must satisfy
            test_code:
              type: string
              description: HumanEval-style test program defining check(candidate)
            entry_point:
              type: string
            code_prefix:
              type: string
              description: Prepended when the answer is only a function body
        max_tokens:
          type: integer
          minimum: 1
          maximum: 4096
          default: 512
        thinking_budget:
          type: integer
          minimum: 16
          maximum: 8192
          description: Per-request System 2 reasoning budget (FR-024); defaults to the per-domain cap
        show_reasoning:
          type: boolean
          default: false
          description: 'Stream System 2 reasoning tokens (marked reasoning: true)'
        ephemeral:
          type: boolean
          default: false
          description: Do not persist the conversation (evaluation and benchmark traffic)
        audit:
          type: boolean
          description: 'Force (true) or suppress (false) audit selection for a kept reply (FR-040). Default: random with probability
            epsilon on live, persisted traffic.'
        ablation_draft_conditioned:
          type: boolean
          description: 'Coupling ablation only (ER-004): System 2 sees the System 1 draft. Rejected with 400 when disabled
            in configuration.'
        retrieve:
          type: boolean
          description: 'FR-061: use (true) or skip (false) retrieval of earlier verified answers, quoted as delimited data
            with provenance; default from configuration'
        adaptive_exit:
          type: boolean
          description: 'FR-082: use (true) or skip (false) the adaptive reasoning exit (probe-and-verify early stop of System
            2 reasoning); default from configuration'
        adaptive_exit_rule:
          type: string
          enum: [consistency, posterior]
          description: 'Phase 8: stopping rule of the adaptive exit on non-verifiable tasks: consistency (k consecutive
            agreeing probes) or posterior (majority posterior over all probes against a collapsing bound); default from
            configuration'
    Message:
      type: object
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
        content:
          type: string
    Usage:
      type: object
      required:
      - prompt_tokens
      - completion_tokens
      - reasoning_tokens
      - wall_ms
      - model_calls
      - verifier_calls
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        reasoning_tokens:
          type: integer
        thinking_budget:
          type:
          - integer
          - 'null'
        wall_ms:
          type: integer
        model_calls:
          type: integer
          description: Bounded by 1+N(R+1) (FR-026)
        verifier_calls:
          type: integer
        ttft_ms:
          type:
          - integer
          - 'null'
          description: Time to first visible token
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageTiming'
          description: Where the time went, in order (NFR-030). Cheap samples run in parallel with the draft.
    ChatReply:
      type: object
      required:
      - assurance
      - decision
      - decision_id
      - domain
      - message
      - reasoning_mode
      - reply_id
      - states
      - trace_state
      - usage
      properties:
        reply_id:
          type: string
          format: uuid
        conversation_id:
          type:
          - string
          - 'null'
          format: uuid
        decision_id:
          type: string
          format: uuid
        reasoning_mode:
          $ref: '#/components/schemas/ReasoningMode'
        assurance:
          $ref: '#/components/schemas/Assurance'
        trace_state:
          $ref: '#/components/schemas/TraceState'
        message:
          $ref: '#/components/schemas/Message'
        uncertainty_notice:
          type:
          - string
          - 'null'
          description: Present when assurance is abstained or the reply is degraded
        verifier:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VerifierResult'
        usage:
          $ref: '#/components/schemas/Usage'
        degraded:
          type: boolean
          default: false
          description: MR-004
        states:
          type: array
          items:
            $ref: '#/components/schemas/TraceState'
        decision:
          $ref: '#/components/schemas/DecisionRecord'
        domain:
          $ref: '#/components/schemas/Domain'
        draft:
          type:
          - string
          - 'null'
          description: The unused System 1 draft when the reply came from System 2
        reasoning:
          type:
          - string
          - 'null'
          description: System 2 reasoning content (kept for traces and debugging, not an explanation)
        rounds:
          type: array
          description: One record per System 2 attempt (absent on the fast path)
          items:
            type: object
            properties:
              round:
                type: integer
              candidate_tokens:
                type: integer
              reasoning_tokens:
                type: integer
              verifier:
                type: string
                description: exact verifier name, judge, or none
              passed:
                type: boolean
        draft_conditioned:
          type: boolean
          description: True only in the coupling ablation
        retrieved:
          type: array
          description: Earlier verified answers used as reference (reply_id, score, created_at, question)
          items:
            type: object
    VerifierResult:
      type: object
      required:
      - verifier
      - passed
      properties:
        verifier:
          type: string
          description: code_tests | math_numeric | json_schema | judge | consensus, or a '+'-joined combination
        passed:
          type: boolean
        score:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        evidence:
          type:
