          description: 'nafs_aql: full system. nafs_blind: verifier hidden at run time (routing and ECE test). fast_only /
            slow_only: baselines. slow_conditioned: coupling ablation (ER-004). slow_b<N>: deliberate-only with thinking budget
            N (budget curve). nafs_aql_l<NN> / nafs_blind_l<NN>: the gated system at lambda = NN/100 (frontier, Prop. 2).'
