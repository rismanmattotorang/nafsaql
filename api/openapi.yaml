          type: string
        profile:
          type: string
        conversation_id:
          type: string
          format: uuid
          description: The room's transcript is the conversation with this id (GET /v1/conversations/{id})
        created_at:
          type: string
        questions:
          type: integer
          description: Questions asked in the room so far
        last_activity:
          type: string
          description: Time of the latest message, or of creation for an empty room (RFC 3339)
        members:
          type: integer
          description: Members connected now
        users:
          type: array
          items:
            type: string
          description: Display names of the members connected now
        busy:
          type: boolean
          description: The assistant is answering a question in this room
        queued:
          type: integer
          description: Questions waiting behind the running one
    RoomFrame:
      type: object
      required:
      - type
      description: 'A WebSocket text frame. `welcome` (to the new member only, always first): `{you, room, users, assistant,
        limits, cursor, pending}`. `presence`: `{joined, members, users}` with the member in `user`. `user_message`:
        `{content, id, ts}` with the sender in `user`. `assistant_event`: `{reply_to, event}` where `event` is a stream
        event (`{event, data}`) for the question with id `reply_to`. `queue`: `{busy, working_for, queued}`. `typing`:
        the typist in `user`. `room_renamed`: `{name}`. `room_deleted`: the socket closes with code 4004 right after.
        `heartbeat` every 25 s; `pong` answers a client `ping`. `error`: `{code, message}` to one member (`E_RATE_LIMITED`,
        `E_QUEUE_FULL`, `E_TOO_LONG`, `E_ROOM_FULL`). `resync`: `{missed}` frames were skipped; reconnect.'
      properties:
        type:
          type: string
          enum:
          - welcome
          - presence
          - user_message
          - assistant_event
          - queue
          - typing
          - room_renamed
          - room_deleted
          - heartbeat
          - pong
          - error
          - resync
        user:
          type: string
        payload:
          type: object
