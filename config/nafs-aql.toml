# Nafs-Aql gateway configuration (OR-006). Values marked "Phase-0 placeholder" are replaced by measurements.
schema_version = "1.0"

[server]
bind = "127.0.0.1:8080"
auth_tokens_env = "NAFS_AUTH_TOKENS"   # comma-separated bearer tokens; unset = local dev mode without auth (NFR-022)
rate_limit_per_token_rpm = 120
request_wall_clock_cap_s = 900         # NFR-001 hard bound (CPU baseline: slow path takes minutes)
max_prompt_tokens = 4096               # NFR-006

[assistant]
profile = "A"
system_prompt = "You are Nafs-Aql, a careful assistant that pairs a fast first answer with deliberate reasoning when a question needs it. If asked who or what you are, say you are Nafs-Aql, built on open Qwen models, and describe that fast-and-careful design. Be accurate and concise. If you are unsure, say so."

[backend]
active = "llama"                       # llama | vllm (switchable at runtime from the System page)

[backends.llama]
label = "llama.cpp (native macOS, GGUF Q4_K_M)"
kind = "llama"
system1 = { url = "http://127.0.0.1:8001/v1", model = "system1", hf_id = "Qwen/Qwen3-1.7B", quantization = "GGUF Q4_K_M (unsloth/Qwen3-1.7B-GGUF)", thinking = false, max_in_flight = 4 }
system2 = { url = "http://127.0.0.1:8002/v1", model = "system2", hf_id = "Qwen/Qwen3-4B-Thinking-2507", quantization = "GGUF Q4_K_M (unsloth/Qwen3-4B-Thinking-2507-GGUF)", thinking = true, max_in_flight = 2 }

[backends.vllm]
label = "vLLM 0.30 CPU (Docker, carstenz/vllm-smoke): Qwen3-0.6B FP32 stand-in, two modes"
kind = "vllm"
# One vLLM server serves both roles (Profile B pattern): System 1 = thinking off, System 2 = thinking on + thinking_token_budget.
# One model in two modes. Qwen3-1.7B in FP32 needs a 10 GiB Docker VM (A-050); on this 32 GB host, with the owner's other
# workloads resident, the 0.6B stand-in validates the backend. Set VLLM_MODEL_DIR/VLLM_SERVED_NAME and these names together.
system1 = { url = "http://127.0.0.1:8101/v1", model = "qwen3-0.6b", hf_id = "Qwen/Qwen3-0.6B", quantization = "FP32 (AVX2-only VM: no BF16 kernels; scripts/serve_vllm_docker.sh)", thinking = false, max_in_flight = 4 }
system2 = { url = "http://127.0.0.1:8101/v1", model = "qwen3-0.6b", hf_id = "Qwen/Qwen3-0.6B (thinking mode)", quantization = "FP32 (AVX2-only VM: no BF16 kernels; scripts/serve_vllm_docker.sh)", thinking = true, max_in_flight = 2 }

[backend_retry]                        # IF-007 / IF-008
max_attempts = 3
base_backoff_ms = 200
max_backoff_ms = 2000
connect_timeout_ms = 2000
stream_idle_timeout_ms = 180000
queue_timeout_ms = 900000

[gate]                                 # FR-010..FR-015 (Theorem 2)
mode = "calibrated"                    # uses the fitted calibration when it exists and passes ECE; otherwise the fixed rule
k_samples = 2                          # cheap System 1 samples for the agreement feature
sample_max_tokens = 160
sample_temperature = 0.8
lambda_default = 0.2                   # price per cost unit (speed-care slider default)
loss_wrong = 1.0
cost_unit_s = 60.0                     # one cost unit = one minute of extra latency on this machine
calibration_file = "data/runtime/gate_calibration.json"
calibration_max_ece = 0.05             # NFR-020
audit_fraction = 0.05                  # FR-040
e2_hat = { code = 0.25, math = 0.15, structured = 0.10, factual = 0.30, open = 0.35, other = 0.35 }     # Phase-0 placeholder
delta_c_s = { code = 150, math = 150, structured = 90, factual = 90, open = 120, other = 120 }         # Phase-0 placeholder (reference machine)

calibration_min_n = 2900               # NFR-020 / ER-005: held-out samples needed before promotion
calibration_min_per_class = 30         # refuse fits with fewer right or wrong drafts (review H1)
escalation_budget = 0.30               # FR-014 budget mode: target escalation rate B
budget_epsilon = 0.025                 # DKW: n >= ln(2/delta) / (2 eps^2) = 2,952 for lambda*
budget_delta = 0.05
recalibrate_every_h = 24               # FR-015: refit from the ledger; promoted only if NFR-020 holds out of sample
params_file = "data/runtime/gate_params.json"   # measured e2_hat, delta_c, caps, budgets (Phase 0)
sample_max_tokens_hard = 384           # math/code samples need room for 'Answer:' (review M11)
samples_on_verifiable = false          # speed: skip the k samples when an exact verifier decides (Thm 1)
samples_when_uncertain = true        # P7-T02: draw the k samples after the draft, only when its log-prob is within the band of the threshold
uncertain_band = 0.10                  # nats around the fixed threshold (benchmarks/samples_ab_factual.json: samples tripled factual draft time)
early_escalation_tokens = 32           # P7-T03 / FR-080: stop an unconfident open-ended draft after N tokens (0 = off)
early_escalation_margin = 0.04          # below the fixed threshold by this much; 100% agreement on 40 prompts (benchmarks/early_escalation_study.json)
confidence_window = 16                 # Phase 8: window of the lowest-window confidence signal (benchmarks/confidence_signal_study.json)
samples_on_unverified_domains = ["math"]   # Phase 8: unverified math drafts always get the k samples; token confidence misses wrong math drafts, disagreement catches them

[gate.fixed]                           # Phase-1 placeholder rule until a calibration passes NFR-020
mean_logprob_threshold = -0.30
agreement_threshold = 0.5
escalate_open_domains = true
# Phase 8: a local collapse of confidence (lowest 16-token window) flags the draft; the draft is stopped the moment it
# happens, with the decision the full draft would get (Prop. N2). Absent = off. Set from benchmarks/confidence_signal_study.json.
low_window_domains = ["math"]          # the signal's scale is domain-specific; only where its threshold was measured

[deliberation]                         # FR-020..FR-026
draft_blind = true
draft_max_tokens = 512
draft_temperature = 0.2
slow_temperature = 0.6
answer_max_tokens = 768
non_verifiable_max_rounds = 1          # FR-022
retry_budget_decay = 1.0               # FR-086: thinking budget of retry round r = budget * decay^r (1.0 = same budget every round; the paired study sets 0.5)
retry_min_budget = 96                  # FR-086: floor for a shrunken retry budget
repair_policy = "best"                 # FR-091: repair the best-scoring candidate (Open Math Harness tree; equals "last" when verdicts are all-or-nothing)
repair_fanout = 2                      # FR-091: repairs of one candidate before the search moves on
patch_repair = false                   # FR-092: code retries may answer with a Codex apply_patch; off until measured (rule 3)
caps = { code = { N = 1, R = 2, budget = 1024 }, math = { N = 1, R = 2, budget = 1024 }, structured = { N = 1, R = 2, budget = 512 }, factual = { N = 1, R = 0, budget = 512 }, open = { N = 1, R = 0, budget = 512 }, other = { N = 1, R = 0, budget = 512 } }
caps_provenance = "Phase-1 defaults sized for the reference CPU; replace with the Prop. 3 cap from the Phase-0 Beta fit"
cost_ratio = 0.15                      # c_p / L_a for the Prop. 3 cap M* = ceil(alpha/cost_ratio - alpha - beta)
max_rounds_cap = 4                     # Lemma 1 bound on derived R
allow_draft_conditioned_ablation = true   # ER-004 coupling test only; never used for user traffic


[deliberation.adaptive_exit]           # P7-T08 / FR-082: probe-and-verify early exit from System 2 reasoning
enabled = true                         # llama-server only (raw continuation with a cached prefix); vLLM uses the standard path
probe_every_tokens = 256               # probe at the latest after this many reasoning tokens without a reflection signal
min_gap_tokens = 64                    # never probe sooner than this after the previous probe (DTSR k = 64)
probe_max_tokens = 24                  # the probe asks for the answer alone, in a few tokens
consistency = 2                        # non-verifiable domains: stop when this many consecutive probes agree (Dynasor-CoT)
domains = ["math", "factual"]          # exact verifier decides for math; answer consistency for factual
exit_rule = "consistency"              # Phase 8: "posterior" (majority posterior over all probes vs a collapsing bound, Prop. N4) or "consistency"
posterior_stop = 0.85                  # bound at the start of the budget: two agreeing probes (0.875) stop, one (0.75) does not
posterior_stop_end = 0.70              # bound when the budget is exhausted (Frazier-Yu: the optimal bound is non-increasing)
reuse_probe_answer = true              # FR-085: a full-answer probe (code tests, JSON Schema) that passes is the final answer; the answer stage is skipped
full_probe_every_tokens = 512          # FR-085: full-answer probes cost an answer each, so they are rarer than short ones
full_probe_min_gap_tokens = 192
full_probe_max_tokens = 384            # FR-085: longest full-answer probe; bounds the probe overhead on items that never pass (the final answer keeps answer_max_tokens)

[judge]                                # FR-034 / SR-003 rubric judge on non-verifiable slow-path answers
enabled = true
thinking_budget = 64                   # System 2 is thinking-only; llama-server treats 0 as unlimited and 1 leaks reasoning into the answer, 32-64 gives clean JSON in ~10 s
max_tokens = 160
floor = 0.5                            # h, a, u >= 0.5
pass_v = 0.7                           # V = 0.5 min(h,a) + 0.25 u + 0.25 m >= 0.7
max_retries = 1                        # R <= 1 on non-verifiable tasks (FR-022)
backend = "system2"                    # P7-T09: "system1" scores the rubric with the fast model (measure its r and phi first)

[audit]                                # FR-040 audit stream, FR-041 capability table
enabled = true
idle_only = true                       # audits run only when no user request is in flight
poll_s = 15
min_audits_measured = 30

[alerts]                               # OR-004: evaluated over the last window_min minutes; drill with POST /v1/alerts/drill
window_min = 60
min_samples = 10
fast_p95_ms = 12000                    # NFR-003
error_rate = 0.05
escalation_rate_max = 0.60
verifier_acceptance_min = 0.30

[retrieval]                            # FR-061 optional retrieval memory of prior verified answers (BM25, delimited as data)
enabled = false
top_k = 2
min_score = 0.35

[verifiers]                            # FR-030..FR-035
python = "python3"
cpu_time_s = 20                        # EvalPlus suites need several CPU-seconds on a loaded host
wall_clock_s = 60
deny_network = true
numeric_tolerance = 1e-6
memory_mb = 1024                       # RSS cap per verifier subprocess (FR-033); some MBPP+ tests need > 512 MB
sympy_python = "python3.10"            # interpreter with SymPy; "" disables symbolic math checks
rates_file = "data/runtime/verifier_rates.json"   # mutation-measured (r, phi), FR-035
lean = "~/.elan/toolchains/leanprover--lean4---v4.35.0/bin/lean"   # FR-090: the `lean` executable of an elan toolchain (core Lean 4.35.0 on the reference machine); "" refuses Lean tasks; a missing file turns Lean off with a warning
lean_path = ""                         # LEAN_PATH of a Mathlib build ("" = core Lean only)
lean_timeout_s = 120
lean_memory_mb = 4096

[storage]
sqlite_path = "data/runtime/nafs.sqlite"
trace_path = "data/runtime/traces/trace.jsonl"
retention_days = 90                    # SR-004 bounded retention (spec default 90 days; 0 = keep forever)
registry_file = "config/models.registry.json"   # active and previous model artefacts (OR-005, Tazkiya promotion)

[harness]                              # FR-093 code agent, POST /v1/harness/code (Codex turn loop, Open Math Harness stop rule)
code_agent_enabled = true
model = "system2"                      # "system2" (reasoning) or "system1" (fast)
max_steps = 6                          # model calls per run
thinking_budget = 512                  # reasoning tokens per step on System 2
step_max_tokens = 768                  # answer tokens per step (a patch or a whole file)
wall_clock_s = 900
keep_exchanges = 3                     # exchanges kept after each context reset
context = "append"                     # Phase 11: "append" = Codex transcript (prompt cache reused, compacted when long); "reset" = Phase 10 loop
compact_at_tokens = 2600               # append mode: compact before a call when the transcript estimate exceeds this (System 1 slots hold 4,096 tokens)
constrain = true                       # sample each action under the step's GBNF grammar (Codex's apply_patch grammar; llama-server only)
stream_cut = true                      # end the model's stream as soon as its action is complete
notes = 2                              # prose lines System 1 may write before an action under the grammar
edit_format = "auto"                   # "auto": whole solution.py while it is missing or short, a patch or the whole file above; "any"; "whole"
whole_max_lines = 80                   # "auto": solution.py lines above which a patch is offered
unstick = true                         # after a step that reproduced judged files: compact the transcript, sample more diversely
first_step_thinking_budget = 256       # System 2 reasoning tokens on the first step; thinking_budget after a failure (0 = thinking_budget always)
